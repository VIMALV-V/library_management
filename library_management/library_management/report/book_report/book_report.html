<div class="container">

    <h3>Book Report</h3>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Book</th>
                <th>Author</th>
            </tr>
        </thead>

        <tbody>
            <% data.forEach(function(row) { %>
                <tr>
                    <td><%= row.book_title %></td>
                    <td><%= row.author %></td>
                </tr>
            <% }); %>
        </tbody>
    </table>

    <p>Author Filter: <%= filters.author %></p>

</div>
